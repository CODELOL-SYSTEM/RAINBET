<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pexi Play</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#10162b;color:#fff;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:#182044;position:sticky;top:0;z-index:5}
header b{font-size:18px}
#cr{font-weight:700;color:#facc15}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#2b3668;color:#fff}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
#menu{display:grid;gap:14px;padding:20px;max-width:560px;margin:auto}
#menu h1{text-align:center;font-size:26px;margin:10px 0}
.card{display:flex;align-items:center;gap:16px;padding:22px;font-size:22px;text-align:left;border-radius:16px}
.card i{font-style:normal;font-size:44px}
.card small{display:block;opacity:.75;font-size:13px;font-weight:400}
.c1{background:linear-gradient(135deg,#0f766e,#164e63)}
.c2{background:linear-gradient(135deg,#b45309,#7c2d12)}
.c3{background:linear-gradient(135deg,#4d7c0f,#14532d)}
.box{max-width:420px;margin:12px auto;padding:0 12px}
.ctl{display:grid;gap:8px;margin-top:12px}
.ctl label{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select{padding:8px;border-radius:8px;border:0;width:130px;background:#222b52;color:#fff;font:inherit}
.go{background:#16a34a}
.out{background:#f59e0b;color:#111}
.adv,.drop{background:#2563eb}
.mult{text-align:center;font-size:30px;font-weight:700;color:#facc15}
.msg{text-align:center;min-height:24px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.road{position:relative;display:flex;overflow-x:auto;background:radial-gradient(#fff1 1px,transparent 1px) 0 0/7px 7px,#2b2e36;border-radius:14px;border:4px solid #111827;box-shadow:inset 0 0 30px #000a}
.ln{position:relative;flex:0 0 92px;height:250px;overflow:hidden;border-right:3px dashed rgba(255,255,255,.28)}
.ln.st{background:linear-gradient(90deg,#3f6212,#4d7c0f);border-right:5px solid #fff}
.ln.st .lm{top:auto;bottom:10px;transform:translateX(-50%);background:#0008;color:#fff;box-shadow:none}
.ln.gl{background:radial-gradient(circle,#854d0e77,transparent 70%)}
.mh{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;z-index:1}
.lm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font-weight:800;font-size:14px;color:#422006;background:linear-gradient(#fde047,#f59e0b);padding:3px 8px;border-radius:12px;box-shadow:0 2px 4px #0009;white-space:nowrap}
.ln.done .lm{background:linear-gradient(#86efac,#16a34a);color:#052e16}
.ch{position:absolute;left:50%;margin-left:-32px;top:38px;width:64px;z-index:5}
.hop{animation:hop .35s}
@keyframes hop{50%{transform:translateY(-26px)}}
.ch.dead svg{filter:grayscale(1) brightness(.3);transform:rotate(80deg)}
.fire{position:absolute;left:50%;margin-left:-40px;top:22px;width:80px;z-index:6;transform-origin:bottom;animation:fl .25s infinite alternate}
@keyframes fl{to{transform:scale(1.15,.9)}}
.car{position:absolute;left:50%;margin-left:-19px;width:38px;top:-90px;z-index:3;animation:drive 3s linear infinite}
@keyframes drive{to{top:260px}}
.bar{position:absolute;left:0;top:6px;width:100%;z-index:3;animation:bd .4s ease-out}
@keyframes bd{from{transform:translateY(-70px);opacity:0}}
#mines{position:relative;min-height:calc(100vh - 52px);background:radial-gradient(ellipse at 50% 0,#7f1d1d,#1a0a0f 70%)}
#mines::before,#mines::after{content:'';position:absolute;top:0;bottom:0;width:min(46px,10vw);background:repeating-linear-gradient(90deg,#b91c1c 0 8px,#7f1d1d 8px 16px);box-shadow:0 0 20px #000}
#mines::before{left:0}
#mines::after{right:0}
#mines .box{position:relative;z-index:1}
.neon{text-align:center;font-size:30px;font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 0 8px #f0abfc,0 0 20px #d946ef,0 0 40px #a21caf;margin-bottom:10px;animation:nf 2.4s infinite}
@keyframes nf{0%,90%,100%{opacity:1}95%{opacity:.55}}
.felt{padding:12px;border-radius:16px;background:radial-gradient(#15803d,#14532d);border:6px dotted #fde047;box-shadow:0 0 25px #fde04788,inset 0 0 25px #000a;animation:bulb 1s infinite alternate}
@keyframes bulb{to{border-color:#fb923c}}
.tile{aspect-ratio:1;padding:6px;background:linear-gradient(#b45309,#78350f);border:2px solid #fde047;box-shadow:0 3px 0 #451a03}
.tile svg{width:100%;height:100%;display:block}
.tile.ok{background:linear-gradient(#065f46,#064e3b)}
.tile.bad{background:linear-gradient(#b91c1c,#7f1d1d)}
.tile.dim{opacity:.6}
.tw{position:relative;width:300px;height:420px;margin:auto;overflow:hidden;background:linear-gradient(#0b1033,#3b2a6b 55%,#f97316);border-radius:12px;cursor:pointer;border:3px solid #111827}
.city,.world{position:absolute;left:0;bottom:14px;width:300px;transition:transform .3s}
.city{height:210px;z-index:1;bottom:0}
.world{height:calc(100% - 14px);z-index:2}
.sk,.hs{position:absolute;bottom:0;background-image:repeating-linear-gradient(0deg,var(--c) 0 8px,transparent 8px 14px),repeating-linear-gradient(90deg,transparent 0 6px,#fcd34d 6px 11px)}
.sk{--c:#334155;background-color:#334155}
.hs{--c:#8b4a3a;background-color:#8b4a3a;clip-path:polygon(0 28%,50% 0,100% 28%,100% 100%,0 100%)}
.gnd{position:absolute;left:0;right:0;bottom:-14px;height:14px;background:#14532d;border-top:3px solid #22c55e}
.mast{position:absolute;right:6px;top:0;bottom:0;width:26px;z-index:0;border:3px solid #ca8a04;border-top:0;background:repeating-linear-gradient(45deg,#ca8a04 0 3px,transparent 3px 14px),repeating-linear-gradient(-45deg,#ca8a04 0 3px,transparent 3px 14px),#0004}
.jib{position:absolute;left:0;right:0;top:0;height:16px;z-index:6;background:repeating-linear-gradient(90deg,#eab308 0 14px,#facc15 14px 28px);border-bottom:3px solid #854d0e}
.jib::after{content:'';position:absolute;right:6px;top:0;width:30px;height:32px;background:#dc2626;border:2px solid #7f1d1d;border-radius:4px}
.trl{position:absolute;top:10px;left:141px;width:18px;height:12px;background:#1f2937;border:2px solid #facc15;z-index:7}
.bl{position:absolute;height:26px;display:flex;align-items:center;justify-content:space-around;padding:0 4px;border-top:3px solid #f1f5f9;border-bottom:3px solid #0006;background-image:repeating-linear-gradient(0deg,#0002 0 1px,transparent 1px 7px)}
.bl i{width:14px;height:14px;flex:none;background:linear-gradient(135deg,#e0f2fe,#38bdf8 60%,#fde68a);border:2px solid #f8fafc;border-radius:3px 3px 1px 1px;box-shadow:0 3px 0 #0005}
.bl i.dr{height:19px;width:16px;border-radius:8px 8px 0 0;background:#78350f;align-self:flex-end;box-shadow:none}
.bl.base{background-color:#a8a29e!important}
.cb{position:absolute;left:50%;bottom:100%;width:2px;height:600px;background:#cbd5e1}
.cb::after{content:'';position:absolute;bottom:0;left:-5px;width:10px;height:10px;border:2px solid #facc15;border-radius:50%}
.pop{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;pointer-events:none;animation:pp 1.1s ease-out forwards}
.pop b{display:block;font-size:44px;font-weight:900;color:#fde047;-webkit-text-stroke:2px #7c2d12;text-shadow:0 4px 0 #b45309,0 0 20px #f59e0b}
.pop small{display:block;font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 0 #be123c,0 0 12px #f43f5e}
.pop.big b{font-size:60px}
@keyframes pp{0%{transform:translateY(20px) scale(.4);opacity:0}25%{transform:translateY(0) scale(1.25);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
/* ---- v4 : boutons, tailles, gros gains, Chicken Road ---- */
#cr{font-size:22px}
button{font-weight:800;letter-spacing:.5px;border-radius:14px;padding:14px 18px;background:linear-gradient(#4f5fb3,#2b3668);box-shadow:0 5px 0 #151b3d,0 8px 14px #0006;transition:transform .08s,box-shadow .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #151b3d}
.go{font-size:22px;background:linear-gradient(#34d399,#059669);box-shadow:0 5px 0 #064e3b,0 8px 14px #0006}
.out{font-size:20px;background:linear-gradient(#fcd34d,#d97706);box-shadow:0 5px 0 #78350f,0 8px 14px #0006}
.adv,.drop{font-size:22px;background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 5px 0 #1e3a8a,0 8px 14px #0006}
.q button{padding:8px 11px;font-size:14px;box-shadow:0 3px 0 #151b3d}
.bet{display:flex;gap:6px;align-items:center}
.box{max-width:640px}
.stage{position:relative}
#menu{max-width:720px}
.card{padding:30px;font-size:26px}
.neon{font-size:42px}
.mult{font-size:40px}
.msg{font-size:18px;font-weight:700}
.wb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none;background:radial-gradient(#fde04777,transparent 65%);animation:wb 2s ease-out forwards}
.wb b{font-size:clamp(48px,15vw,110px);font-weight:900;color:#fde047;-webkit-text-stroke:3px #7c2d12;text-shadow:0 6px 0 #b45309,0 0 30px #f59e0b}
.wb small{font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 #be123c,0 0 16px #f43f5e}
@keyframes wb{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.2);opacity:1}30%{transform:scale(1)}85%{opacity:1}100%{transform:scale(1.05);opacity:0}}
.ln{flex:0 0 120px;height:340px;border-right:4px dashed rgba(255,255,255,.3)}
.mh{width:104px;height:104px;margin:-52px 0 0 -52px}
.lm{font-size:18px;padding:4px 12px}
.ln.st .lm{font-size:15px}
.ch{width:88px;margin-left:-44px;top:64px}
.ch svg{animation:idle .9s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4px) scaleY(1.04)}}
.ch.dead svg{animation:none}
.fire{width:120px;margin-left:-60px;top:10px;filter:drop-shadow(0 0 22px #f97316)}
.car{width:52px;margin-left:-26px}
.car.tk{width:56px;margin-left:-28px;top:-200px}
@keyframes drive{to{top:360px}}
.bar{top:10px}
.hole{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(#000,#1c0a00 70%);box-shadow:0 0 30px #f97316;z-index:0}
.boom .mh{animation:lid .8s ease-out forwards}
.boom .lm{display:none}
@keyframes lid{to{transform:translateY(-170px) rotate(540deg);opacity:0}}
.pg{height:10px;background:#0006;border-radius:6px;margin-bottom:8px;overflow:hidden}
.pg b{display:block;height:100%;width:0;background:linear-gradient(90deg,#fde047,#f97316);transition:width .3s}
/* ---- v5 : nouveaux jeux ---- */
.c4{background:linear-gradient(135deg,#be185d,#7e22ce)}
.c5{background:linear-gradient(135deg,#0e7490,#1e3a8a)}
.c6{background:linear-gradient(135deg,#6d28d9,#db2777)}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#451a03}
.mtop b{font-size:34px}
.mtop span{display:flex;gap:6px}
.mtop button{padding:8px 12px;font-size:13px;box-shadow:0 3px 0 #151b3d}
.mtop button.on{background:linear-gradient(#34d399,#059669)}
#merge,#words,#blast{min-height:calc(100vh - 52px)}
#mc{display:block;width:100%;max-width:360px;margin:auto;border-radius:16px;border:4px solid #fff;touch-action:none;box-shadow:0 10px 30px #0005}
#merge .msg{color:#451a03}
#words{background:linear-gradient(#0e7490,#164e63)}
.wtt{text-align:center;margin:12px 0}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wh b{font-size:26px}
.wg{display:grid;gap:3px;touch-action:none;user-select:none;background:#fff2;padding:8px;border-radius:14px}
.wc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(13px,4vw,22px);background:#fff;color:#1e293b;border-radius:6px;cursor:pointer}
.wc.sel{background:#fde047}
.wc.found{color:#fff;background:var(--c)}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wl span{background:#fff2;padding:5px 11px;border-radius:10px;font-weight:700}
.wl .ok{text-decoration:line-through;opacity:.5}
#blast{background:radial-gradient(circle at 15% 15%,#f472b6,transparent 40%),radial-gradient(circle at 85% 30%,#38bdf8,transparent 40%),radial-gradient(circle at 50% 95%,#a78bfa,transparent 45%),#1e1b4b}
.bs{display:flex;justify-content:space-between;font-size:18px;margin-bottom:10px}
.bs b{font-size:30px}
.bb{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;border-radius:26px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px #fff9,0 20px 50px #0006}
.bc{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px #0005}
.bc.f,.pc i{background-color:var(--c);background-image:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,0) 55%);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 2px 3px #fffb,inset 0 -4px 8px #0003,0 3px 8px #0004}
.bc.pv{outline:2px solid #fff;background:rgba(255,255,255,.35)}
.bc.clr{animation:clr .25s forwards}
@keyframes clr{to{transform:scale(0);opacity:0}}
.tr{display:flex;justify-content:space-around;align-items:center;margin-top:18px;min-height:120px;padding:10px;border-radius:22px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35)}
.slot{flex:1;display:flex;justify-content:center}
.pc{--cs:20px;display:grid;gap:3px;grid-auto-rows:var(--cs);touch-action:none;cursor:grab}
.pc i,.pc u{width:var(--cs);height:var(--cs);border-radius:6px}
.pc.gh{position:fixed;z-index:50;pointer-events:none}
#bm{cursor:pointer}
/* tour : maisons */
.bl{border-top:3px solid #fff;border-bottom:4px solid #0003;background-image:linear-gradient(#fff3,#fff0 40%,#0002)}
.bl i{position:relative;width:15px;height:18px;border-radius:8px 8px 2px 2px;background:linear-gradient(#bfe7ff,#60a5fa);border:2px solid #fff;box-shadow:-5px 0 0 #1e3a8a,5px 0 0 #1e3a8a}
.bl i::after{content:'';position:absolute;left:-4px;right:-4px;bottom:-5px;height:5px;border-radius:2px;background:linear-gradient(90deg,#ec4899 0 25%,#16a34a 25% 50%,#ec4899 50% 75%,#16a34a 75%)}
.bl i.dr{box-shadow:none;background:#78350f;border-color:#fde68a}
.bl i.dr::after{display:none}

/* ---- v9 : fonds clairs, mises en pièces, poule XXL ---- */
body{background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 30%,#a1c4fd 65%,#c2e9fb 100%) fixed;text-shadow:0 1px 3px rgba(0,0,0,.35)}
input,select,button{text-shadow:none}
header{background:linear-gradient(90deg,#7c3aed,#db2777);box-shadow:0 4px 14px #0004}
#cr{color:#fff7ae}
button{background:linear-gradient(#a78bfa,#7c3aed);box-shadow:0 5px 0 #4c1d95,0 8px 14px #0004}
button:active:not(:disabled){box-shadow:0 1px 0 #4c1d95}
input,select{background:#fff;color:#1e1b4b}
#menu h1{color:#fff;text-shadow:0 3px 8px #0006}
#betbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 12px;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:800}
#betbar input{width:90px}
#betbar .q{display:flex;gap:4px}
#betbar button{padding:8px 11px;font-size:14px;box-shadow:0 3px 0 #4c1d95}
#betbar .go{font-size:16px}
#bin{font-size:14px}
#mines{background:radial-gradient(ellipse at 50% 0,#fde68a,#fb923c 85%)}
#water{background:linear-gradient(#a5f3fc,#38bdf8 60%,#6366f1)}
#knife{background:linear-gradient(#fde68a,#f59e0b)}
#mj{background:radial-gradient(#6ee7b7,#10b981)}
#solo{background:radial-gradient(#4ade80,#15803d)}
#words{background:linear-gradient(#5eead4,#22d3ee)}
#blast{background:radial-gradient(circle at 15% 15%,#f9a8d4,transparent 45%),radial-gradient(circle at 85% 30%,#7dd3fc,transparent 45%),#c4b5fd}
#bubble{background:linear-gradient(#c4b5fd,#f9a8d4)}
#screw{background:linear-gradient(#fde68a,#fdba74)}
#merge .msg{color:#fff}
.ch{width:124px;margin-left:-62px;top:50px}
.ln.st .lm{color:#fff}


.c1{background:linear-gradient(135deg,#0f766e,#164e63)}
.c2{background:linear-gradient(135deg,#b45309,#7c2d12)}
.c3{background:linear-gradient(135deg,#4d7c0f,#14532d)}
.c4{background:linear-gradient(135deg,#be185d,#7e22ce)}
.c5{background:linear-gradient(135deg,#0e7490,#1e3a8a)}
.c6{background:linear-gradient(135deg,#6d28d9,#db2777)}
@media(max-width:520px){#menu{padding:12px}.card{padding:18px;font-size:20px}.card i{font-size:36px}}
</style>
</head>
<body>
<header>
  <button id="home">☰ Menu</button>
  <b>Pexi Play</b>
  <span id="cr">💰 <span id="bal">1000</span></span>
</header>
<main>
  <section id="menu" class="scr">
    <h1>Choisis ton jeu</h1>
    <button class="card c1" data-g="mines"><i>🪙</i><span>Coin Miner<small>Trouve les pièces, évite les bombes</small></span></button>
    <button class="card c2" data-g="tower"><i>🏗️</i><span>Tower Builder<small>Empile les blocs le plus haut possible</small></span></button>
    <button class="card c3" data-g="chicken"><i>🐔</i><span>Chicken Road<small>Fais traverser la poule sans te faire écraser</small></span></button>
    <button class="card c4" data-g="merge"><i>🍉</i><span>Fruit / Squishie Merge<small>Fusionne les fruits ou les squishies</small></span></button>
    <button class="card c5" data-g="words"><i>🔎</i><span>Mots Mêlés<small>Trouve tous les mots cachés</small></span></button>
    <button class="card c6" data-g="blast"><i>🧊</i><span>Block Blast<small>Place les blocs et complète les lignes</small></span></button>
    <button class="card c1" data-g="mj"><i>🀄</i><span>Mahjong<small>Associe les tuiles identiques</small></span></button>
    <button class="card c2" data-g="water"><i>🧪</i><span>Water Sort<small>Trie les couleurs dans les tubes</small></span></button>
    <button class="card c3" data-g="knife"><i>🔪</i><span>Knife Hit<small>Lance les couteaux sans toucher les autres</small></span></button>
    <button class="card c4" data-g="solo"><i>🃏</i><span>Solitaire<small>Trie les cartes</small></span></button>
    <button class="card c5" data-g="screw"><i>🔩</i><span>Screw Puzzle<small>Retire les vis et libère les pièces</small></span></button>
    <button class="card c6" data-g="bubble"><i>🫧</i><span>Bubble Shooter<small>Associe les bulles de même couleur</small></span></button>
  </section>
  <section id="mines" class="scr hidden"></section>
  <section id="tower" class="scr hidden"></section>
  <section id="chicken" class="scr hidden"></section>
  <section id="merge" class="scr hidden"></section>
  <section id="words" class="scr hidden"></section>
  <section id="blast" class="scr hidden"></section>
  <section id="mj" class="scr hidden"></section>
  <section id="water" class="scr hidden"></section>
  <section id="knife" class="scr hidden"></section>
  <section id="solo" class="scr hidden"></section>
  <section id="screw" class="scr hidden"></section>
  <section id="bubble" class="scr hidden"></section>
</main>
<div id="xpbar" style="max-width:560px;margin:10px auto;padding:0 14px;text-align:center;font-weight:800">
  <span id="xpt">XP 0/50</span>
  <div style="height:8px;background:#0003;border-radius:9px;overflow:hidden"><div id="xpb" style="height:100%;width:0;background:#facc15"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
